<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow — Modern Task Management</title>
  <meta name="description" content="Manage your tasks efficiently with TaskFlow built on Google Apps Script and Vercel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsrounded/task_alt/default/24px.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }
    .loading-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    .app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Sleek Loading Screen -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-title">TaskFlow</div>
    <div class="loading-sub">Loading your workspace…</div>
  </div>

  <!-- Embedded Apps Script Web App -->
  <iframe 
    id="taskflowFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbw1h-ADzSb-54PpG4gJxpG08XHg1Nm7Faav-psw8NWm2vkbj3JVylhEOsKiuaaa_Kn0/exec"
    allow="clipboard-read; clipboard-write; geolocation"
    title="TaskFlow Web Application"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loader = document.getElementById('loadingScreen');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.style.display = 'none', 400);
      }
    }
    // Fallback timer: Hide loader after 3.5 seconds in case browser suppresses onload
    setTimeout(hideLoading, 3500);
  </script>

</body>
</html>
